<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Dom's Quiz Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #E63946;
    --red-dark: #B8202D;
    --blue: #1E6FD9;
    --blue-dark: #1452A6;
    --sun: #FFC93C;
    --sun-dark: #E9A400;
    --green: #22A86A;
    --green-soft: #DDF6EA;
    --purple: #7B4FD6;
    --ink: #2B2D42;
    --muted: #6B6F86;
    --paper: #FFFFFF;
    --bg: #FFF6E0;
    --radius: 22px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }

  body {
    font-family: 'Fredoka', system-ui, sans-serif;
    color: var(--ink);
    background-color: var(--bg);
    background-image:
      radial-gradient(circle, rgba(230,57,70,.14) 3px, transparent 3.5px),
      radial-gradient(circle, rgba(30,111,217,.14) 3px, transparent 3.5px);
    background-size: 56px 56px;
    background-position: 0 0, 28px 28px;
    -webkit-tap-highlight-color: transparent;
  }

  /* Screens */
  .screen {
    display: none;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 24px 16px 32px;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .screen.active { display: flex; animation: pop-in .35s ease; }
  @keyframes pop-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .card {
    background: var(--paper);
    border-radius: var(--radius);
    box-shadow: 0 8px 0 rgba(43,45,66,.12);
    padding: 32px 22px;
    width: 100%;
    max-width: 560px;
    text-align: center;
  }

  /* Logo */
  .logo { display: block; max-width: 200px; max-height: 110px; margin: 0 auto 8px; }
  .logo-text {
    display: inline-block;
    font-weight: 700;
    font-size: 26px;
    color: #fff;
    background: var(--purple);
    padding: 6px 18px;
    border-radius: 12px;
    margin-bottom: 8px;
  }

  /* Home */
  .title {
    font-size: clamp(56px, 16vw, 104px);
    font-weight: 700;
    line-height: 1;
    margin: 12px 0 28px;
    letter-spacing: 1px;
  }
  .title span { display: inline-block; animation: bob 2.4s ease-in-out infinite; }
  .title span:nth-child(2) { animation-delay: .1s; }
  .title span:nth-child(3) { animation-delay: .2s; }
  .title span:nth-child(4) { animation-delay: .3s; }
  .title span:nth-child(6) { animation-delay: .4s; }
  .title span:nth-child(7) { animation-delay: .5s; }
  .title span:nth-child(8) { animation-delay: .6s; }
  .title span:nth-child(9) { animation-delay: .7s; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .c-red { color: var(--red); }
  .c-blue { color: var(--blue); }
  .c-sun { color: var(--sun-dark); }
  .c-green { color: var(--green); }
  .c-purple { color: var(--purple); }

  /* Buttons */
  .btn {
    font: inherit;
    font-weight: 700;
    font-size: 22px;
    padding: 14px 44px;
    border: 0;
    border-radius: 999px;
    background: var(--sun);
    color: var(--ink);
    box-shadow: 0 6px 0 var(--sun-dark);
    cursor: pointer;
    transition: transform .08s, box-shadow .08s;
    min-height: 56px;
  }
  .btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 var(--sun-dark); }
  .btn:disabled { background: #E9E5DA; box-shadow: 0 6px 0 #D2CDBF; color: #A29E8E; cursor: not-allowed; }
  .btn:focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }

  /* Name screens */
  .name-card { border-top: 10px solid var(--red); }
  .name-card.t2 { border-top-color: var(--blue); }
  .name-label { display: block; font-size: clamp(24px, 6vw, 32px); font-weight: 600; margin-bottom: 18px; }
  .name-input {
    font: inherit;
    font-size: 24px;
    width: 100%;
    padding: 14px 16px;
    border: 4px solid var(--red);
    border-radius: 16px;
    text-align: center;
    color: var(--ink);
    outline: none;
  }
  .t2 .name-input { border-color: var(--blue); }
  .name-input:focus { box-shadow: 0 0 0 5px rgba(230,57,70,.2); }
  .t2 .name-input:focus { box-shadow: 0 0 0 5px rgba(30,111,217,.2); }
  .counter { color: var(--muted); font-size: 16px; margin: 8px 0 22px; }

  /* Quiz screen */
  #quiz { justify-content: flex-start; }
  .scorebar { display: flex; justify-content: space-between; gap: 12px; width: 100%; max-width: 780px; }
  .team {
    flex: 1 1 0;
    min-width: 0;
    border-radius: 18px;
    padding: 10px 14px;
    color: #fff;
    display: flex;
    flex-direction: column;
    box-shadow: 0 5px 0 var(--red-dark);
    background: var(--red);
    align-items: flex-start;
    text-align: left;
  }
  .team.t2 { background: var(--blue); box-shadow: 0 5px 0 var(--blue-dark); align-items: flex-end; text-align: right; }
  .team .name { font-weight: 600; font-size: clamp(15px, 4vw, 20px); line-height: 1.15; overflow-wrap: anywhere; }
  .team .score { font-size: clamp(30px, 8vw, 40px); font-weight: 700; line-height: 1.05; }
  .bump { animation: bump .5s ease; }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.45); } 100% { transform: scale(1); } }

  .round-label {
    margin: 20px 0 6px;
    font-weight: 700;
    font-size: clamp(17px, 4.5vw, 24px);
    background: var(--purple);
    color: #fff;
    padding: 6px 20px;
    border-radius: 999px;
    text-align: center;
  }
  .q-count { color: var(--muted); font-size: 16px; }
  .question {
    font-size: clamp(22px, 5.6vw, 34px);
    font-weight: 600;
    max-width: 780px;
    text-align: center;
    margin: 12px 0 8px;
    line-height: 1.25;
  }
  .hint { color: var(--muted); font-size: 15px; text-align: center; margin-bottom: 14px; max-width: 780px; }
  .hint b.r { color: var(--red); }
  .hint b.b { color: var(--blue); }

  .answers { width: 100%; max-width: 780px; display: flex; flex-direction: column; gap: 12px; }
  .answer {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 12px;
    background: var(--paper);
    border-radius: 18px;
    padding: 10px 12px;
    box-shadow: 0 4px 0 rgba(43,45,66,.1);
    border: 3px solid transparent;
    transition: background .2s, border-color .2s;
  }
  .answer .text { font-size: clamp(17px, 4.5vw, 23px); font-weight: 500; text-align: center; line-height: 1.2; }
  .answer .letter {
    display: inline-grid;
    place-items: center;
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--bg);
    font-weight: 700;
    font-size: 16px;
    margin-right: 6px;
    vertical-align: middle;
  }
  .answer.correct { border-color: var(--green); background: var(--green-soft); }
  .answer.correct .letter { background: var(--green); color: #fff; }
  .answer.dim { opacity: .55; }

  .pick { position: relative; width: 50px; height: 50px; flex: none; color: var(--red); }
  .pick.t2 { color: var(--blue); }
  .pick input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
  .pick input:disabled { cursor: default; }
  .pick .box {
    display: grid;
    place-items: center;
    width: 100%; height: 100%;
    border-radius: 12px;
    border: 4px solid currentColor;
    background: #fff;
    pointer-events: none;
    transition: background .12s, transform .12s;
  }
  .pick input:checked + .box { background: currentColor; transform: scale(1.06); }
  .pick input:checked + .box::after {
    content: "";
    width: 12px; height: 22px;
    border: solid #fff;
    border-width: 0 5px 5px 0;
    transform: translateY(-2px) rotate(45deg);
  }
  .pick.waiting { opacity: .28; }
  .pick.waiting input { cursor: not-allowed; }
  .pick.locked .box,
  .pick.locked input:checked + .box { background: #F3F0E8; transform: none; }
  .pick.locked .box::after,
  .pick.locked input:checked + .box::after {
    content: "🔒"; font-size: 18px; width: auto; height: auto; border: 0; transform: none;
  }
  .team.turn { outline: 4px solid var(--sun); outline-offset: 3px; }
  .team.flash { animation: flash .45s ease-in-out 3; }
  @keyframes flash { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(1.04); } }
  .pick input:focus-visible + .box { outline: 3px solid var(--ink); outline-offset: 3px; }

  .feedback { margin: 18px 0 4px; min-height: 30px; text-align: center; max-width: 780px; }
  .feedback .ans { font-size: clamp(18px, 4.6vw, 22px); font-weight: 600; color: var(--green); }
  .feedback .who { font-size: clamp(17px, 4.4vw, 21px); font-weight: 500; margin-top: 4px; }
  .actions { margin-top: 14px; }

  /* Final screen */
  .final-title { font-size: clamp(30px, 8vw, 44px); margin: 6px 0 18px; }
  .final-scores { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }
  .final-row {
    border-radius: 16px;
    padding: 12px 16px;
    color: #fff;
    font-size: clamp(19px, 5vw, 24px);
    font-weight: 600;
    background: var(--red);
    overflow-wrap: anywhere;
  }
  .final-row.t2 { background: var(--blue); }
  .winner-msg { font-size: clamp(22px, 6vw, 30px); font-weight: 700; line-height: 1.25; margin: 0 0 10px; }
  .loser-msg { font-size: clamp(18px, 4.6vw, 22px); color: var(--muted); margin: 0 0 26px; }

  /* Bonus round */
  .bonus-card { border-top: 10px solid var(--purple); }
  .bonus-star { font-size: 64px; line-height: 1; color: var(--sun-dark); animation: bob 2s ease-in-out infinite; }
  .bonus-title { font-size: clamp(40px, 11vw, 64px); margin: 8px 0 6px; color: var(--purple); }
  .bonus-text { font-size: clamp(18px, 4.6vw, 22px); color: var(--muted); margin: 0 0 24px; }

  /* Mute button */
  .mute {
    position: fixed; right: 14px; bottom: 14px; z-index: 20;
    width: 48px; height: 48px; border-radius: 50%; border: 0;
    background: var(--paper); box-shadow: 0 4px 0 rgba(43,45,66,.15);
    font-size: 22px; cursor: pointer;
  }
  .mute:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  /* Confetti */
  .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 10; }
  .confetti i {
    position: absolute;
    top: -20px;
    width: 10px; height: 16px;
    border-radius: 3px;
    animation: fall linear forwards;
  }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .confetti { display: none; }
  }

  @media (max-width: 420px) {
    .answer { gap: 8px; padding: 8px; }
    .pick { width: 44px; height: 44px; }
    .answer .letter { width: 26px; height: 26px; font-size: 14px; }
  }
</style>
</head>
<body>

<!-- Home -->
<section class="screen active" id="home">
  <div class="card">
    <div class="logo-text">Dom's</div>
    <h1 class="title" aria-label="Quiz Time">
      <span class="c-red">Q</span><span class="c-blue">u</span><span class="c-sun">i</span><span class="c-green">z</span>
      <br>
      <span class="c-purple">T</span><span class="c-red">i</span><span class="c-blue">m</span><span class="c-sun">e</span>
    </h1>
    <button class="btn" id="startBtn">Start</button>
  </div>
</section>

<!-- Team 1 name -->
<section class="screen" id="team1">
  <div class="card name-card" id="team1Form">
    <label class="name-label" for="team1Input">Enter <span class="c-red">Team 1</span>’s name:</label>
    <input class="name-input" id="team1Input" type="text" maxlength="20" autocomplete="off">
    <div class="counter"><span id="team1Count">0</span>/20</div>
    <button class="btn" type="button" id="team1Next" disabled>Next</button>
  </div>
</section>

<!-- Team 2 name -->
<section class="screen" id="team2">
  <div class="card name-card t2" id="team2Form">
    <label class="name-label" for="team2Input">Enter <span class="c-blue">Team 2</span>’s name:</label>
    <input class="name-input" id="team2Input" type="text" maxlength="20" autocomplete="off">
    <div class="counter"><span id="team2Count">0</span>/20</div>
    <button class="btn" type="button" id="team2Next" disabled>Next</button>
  </div>
</section>

<!-- Quiz -->
<section class="screen" id="quiz">
  <div class="scorebar">
    <div class="team t1"><span class="name" id="t1Name"></span><span class="score" id="t1Score">0</span></div>
    <div class="team t2"><span class="name" id="t2Name"></span><span class="score" id="t2Score">0</span></div>
  </div>
  <div class="round-label" id="roundLabel"></div>
  <div class="q-count" id="qCount"></div>
  <div class="question" id="questionText"></div>
  <div class="hint" id="hint"></div>
  <div class="answers" id="answers"></div>
  <div class="feedback" id="feedback" aria-live="polite"></div>
  <div class="actions"><button class="btn" id="submitBtn" disabled>Submit</button></div>
</section>

<!-- Bonus round intro -->
<section class="screen" id="bonus">
  <div class="card bonus-card">
    <div class="bonus-star" aria-hidden="true">★</div>
    <h2 class="bonus-title">Bonus round</h2>
    <p class="bonus-text">2 current affairs questions from this month's news. Every point counts!</p>
    <button class="btn" id="bonusBtn">Let's go</button>
  </div>
</section>

<button class="mute" id="muteBtn" aria-label="Sound on" title="Sound on or off">🔊</button>

<!-- Final -->
<section class="screen" id="final">
  <div class="card">
    <div class="logo-text">Dom's</div>
    <h2 class="final-title">Final scores</h2>
    <div class="final-scores">
      <div class="final-row" id="final1"></div>
      <div class="final-row t2" id="final2"></div>
    </div>
    <p class="winner-msg" id="winnerMsg"></p>
    <p class="loser-msg" id="loserMsg"></p>
    <button class="btn" id="againBtn">Play again</button>
  </div>
</section>

<script>
  // Answer index: A = 0, B = 1, C = 2, D = 3
  const ROUNDS = [
    { topic: "General knowledge", questions: [
      ["Which animal is known as the \"king of the jungle\"?", ["Lion", "Tiger", "Elephant", "Gorilla"], 0],
      ["What is the capital city of Italy?", ["Milan", "Venice", "Naples", "Rome"], 3],
      ["Which fruit is dried to make raisins?", ["Plums", "Grapes", "Cherries", "Apricots"], 1],
      ["In which sport does \"love\" mean a score of zero?", ["Tennis", "Cricket", "Golf", "Badminton"], 0],
      ["Which fictional detective lived at 221B Baker Street?", ["Hercule Poirot", "Miss Marple", "Inspector Morse", "Sherlock Holmes"], 3],
      ["What is 7 x 8?", ["56", "54", "63", "48"], 0],
      ["Which chocolate bar shares its name with our galaxy?", ["Mars", "Milky Way", "Twix", "Starbar"], 1],
      ["In which country did the ancient Olympic Games begin?", ["Italy", "Egypt", "Greece", "Turkey"], 2],
      ["What is a group of crows called?", ["A flock", "A parliament", "A murder", "A gaggle"], 2],
      ["Which is the only letter that does not appear in the name of any US state?", ["J", "Q", "X", "Z"], 1]
    ]},
    { topic: "Premier League", questions: [
      ["How many teams play in the Premier League?", ["18", "20", "22", "24"], 1],
      ["In which year did the Premier League start?", ["1992", "1988", "1996", "2000"], 0],
      ["Which club is nicknamed \"The Toffees\"?", ["Fulham", "Brentford", "Crystal Palace", "Everton"], 3],
      ["Which club won the 2015-16 Premier League after starting the season as 5,000-1 outsiders?", ["Leicester City", "Tottenham", "West Ham", "Southampton"], 0],
      ["Which Man City player was named Premier League Player of the Season for 2023-24?", ["Rodri", "Kevin De Bruyne", "Phil Foden", "Erling Haaland"], 2],
      ["Who was Liverpool's manager when they won the 2024-25 Premier League?", ["Jürgen Klopp", "Xabi Alonso", "Brendan Rodgers", "Arne Slot"], 3],
      ["Which was the first club to be relegated from the Premier League after winning it?", ["Leeds United", "Aston Villa", "Blackburn Rovers", "Newcastle United"], 2]
    ]},
    { topic: "Space flight", questions: [
      ["Who was the first person to walk on the Moon?", ["Buzz Aldrin", "Michael Collins", "Neil Armstrong", "John Glenn"], 2],
      ["What does ISS stand for?", ["Interstellar Space Ship", "International Satellite System", "Inner Solar Station", "International Space Station"], 3],
      ["What is NASA's programme to send astronauts back to the Moon called?", ["Apollo", "Artemis", "Gemini", "Orion"], 1],
      ["What was the name of the dog that became the first animal to orbit the Earth, in 1957?", ["Laika", "Belka", "Rex", "Sputnik"], 0],
      ["Who became the first woman in space, in 1963?", ["Sally Ride", "Helen Sharman", "Mae Jemison", "Valentina Tereshkova"], 3],
      ["Who became the first British person in space, visiting the Mir space station in 1991?", ["Tim Peake", "Michael Foale", "Helen Sharman", "Piers Sellers"], 2],
      ["Which was the first space shuttle to fly into space, in 1981?", ["Challenger", "Columbia", "Discovery", "Atlantis"], 1]
    ]},
    { topic: "French", questions: [
      ["What does \"bonjour\" mean in English?", ["Goodbye", "Please", "Good night", "Hello"], 3],
      ["What is the French word for \"cat\"?", ["Chien", "Chapeau", "Chat", "Cheval"], 2],
      ["What are the colours of the French flag?", ["Red, white and green", "Blue, yellow and red", "Blue, white and red", "Green, white and orange"], 2],
      ["What does \"merci beaucoup\" mean?", ["Thank you very much", "You're welcome", "Excuse me", "See you soon"], 0],
      ["What is the French word for Thursday?", ["Jeudi", "Mardi", "Vendredi", "Mercredi"], 0],
      ["Which Paris museum is home to the Mona Lisa?", ["The Musée d'Orsay", "The Louvre", "The Pompidou Centre", "The Palace of Versailles"], 1],
      ["What number is \"quatre-vingts\" in French?", ["24", "80", "40", "90"], 1]
    ]},
    { topic: "Geometry Dash", questions: [
      ["What shape is the default player icon in Geometry Dash?", ["A triangle", "A circle", "A star", "A cube"], 3],
      ["What is the first main level in Geometry Dash?", ["Back On Track", "Stereo Madness", "Polargeist", "Dry Out"], 1],
      ["How many secret coins are hidden in each numbered main level?", ["1", "2", "3", "5"], 2],
      ["In which game mode do you hold to fly upwards and let go to drop?", ["Ship", "Ball", "Spider", "Robot"], 0],
      ["Geometry Dash creator RobTop comes from which country?", ["Norway", "Sweden", "Germany", "Canada"], 1],
      ["Which main level was the first to have Demon difficulty?", ["Clubstep", "Theory of Everything 2", "Deadlocked", "Electrodynamix"], 0],
      ["Which new game mode arrived with update 2.2 in December 2023?", ["Spider", "Wave", "Robot", "Swing"], 3]
    ]},
    { topic: "General knowledge", questions: [
      ["How many wheels does a tricycle have?", ["2", "3", "4", "1"], 1],
      ["Which bird is a symbol of peace?", ["Swan", "Robin", "Eagle", "Dove"], 3],
      ["Which Disney film features the song \"Let It Go\"?", ["Moana", "Tangled", "Frozen", "Encanto"], 2],
      ["Which Italian city is famous for its canals and gondolas?", ["Florence", "Venice", "Pisa", "Turin"], 1],
      ["Who wrote Charlie and the Chocolate Factory?", ["Roald Dahl", "David Walliams", "Enid Blyton", "C.S. Lewis"], 0],
      ["What is the capital city of Japan?", ["Kyoto", "Osaka", "Beijing", "Tokyo"], 3],
      ["How many sides does a 50p coin have?", ["6", "8", "7", "9"], 2],
      ["In Greek myths, who is the king of the gods?", ["Apollo", "Poseidon", "Hades", "Zeus"], 3],
      ["After London, which UK city has the most people?", ["Manchester", "Glasgow", "Birmingham", "Leeds"], 2],
      ["Which blood type can be given to almost anyone, so is called the universal donor?", ["O negative", "A positive", "AB positive", "B negative"], 0]
    ]},
    { topic: "Current affairs", bonus: true, questions: [
      ["The COP31 climate summit was held this month in Antalya. Which country is Antalya in?", ["Turkey", "Greece", "Egypt", "Spain"], 0],
      ["In the US midterm elections on 3 November, which party won control of the House of Representatives?", ["Republicans", "Democrats", "Greens", "Libertarians"], 1]
    ]}
  ];

  // Flatten into one list
  const QUESTIONS = [];
  ROUNDS.forEach((round, r) => {
    round.questions.forEach((q, i) => {
      QUESTIONS.push({ round: r + 1, bonus: !!round.bonus, topic: round.topic, num: i + 1, of: round.questions.length, text: q[0], options: q[1], answer: q[2] });
    });
  });

  const LETTERS = ["A", "B", "C", "D"];

  // Sound: made in the browser, no audio files needed
  let audioCtx = null;
  let muted = false;
  try { muted = localStorage.getItem("quizMuted") === "1"; } catch (e) {}

  function getAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
    } catch (e) { audioCtx = null; }
    return audioCtx;
  }

  function tone(ctx, freq, start, dur, type, vol, slideTo) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, start);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, start + dur);
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(vol, start + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(start);
    osc.stop(start + dur + 0.02);
  }

  // Reveal: quick electronic blip arpeggio
  function playReveal() {
    if (muted) return;
    const ctx = getAudio(); if (!ctx) return;
    const t = ctx.currentTime + 0.02;
    tone(ctx, 523.25, t,        0.09, "square", 0.12);
    tone(ctx, 783.99, t + 0.08, 0.09, "square", 0.12);
    tone(ctx, 1046.5, t + 0.16, 0.22, "square", 0.12, 1568);
  }

  // Turn: soft two-note chime
  function playTurn() {
    if (muted) return;
    const ctx = getAudio(); if (!ctx) return;
    const t = ctx.currentTime + 0.02;
    tone(ctx, 880, t, 0.12, "sine", 0.07);
    tone(ctx, 1174.66, t + 0.1, 0.18, "sine", 0.06);
  }

  // Winner: electronic fanfare
  function playFanfare() {
    if (muted) return;
    const ctx = getAudio(); if (!ctx) return;
    const t = ctx.currentTime + 0.05;
    const run = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5, 1318.5];
    run.forEach((f, i) => tone(ctx, f, t + i * 0.11, 0.12, "square", 0.1));
    const end = t + run.length * 0.11 + 0.05;
    [523.25, 659.25, 783.99, 1046.5].forEach(f => tone(ctx, f, end, 1.1, "sawtooth", 0.06));
    tone(ctx, 1568, end, 1.1, "square", 0.05);
  }

  function updateMuteBtn() {
    const b = $("muteBtn");
    b.textContent = muted ? "🔇" : "🔊";
    b.setAttribute("aria-label", muted ? "Sound off" : "Sound on");
  }
  const state = { names: ["", ""], scores: [0, 0], index: 0, revealed: false };
  const $ = id => document.getElementById(id);

  function show(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    $(id).classList.add("active");
    window.scrollTo(0, 0);
    const input = $(id).querySelector("input[type=text]");
    if (input) setTimeout(() => input.focus(), 50);
  }

  updateMuteBtn();
  $("muteBtn").addEventListener("click", () => {
    muted = !muted;
    try { localStorage.setItem("quizMuted", muted ? "1" : "0"); } catch (e) {}
    updateMuteBtn();
    if (!muted) playReveal();
  });

  // Home
  $("startBtn").addEventListener("click", () => { getAudio(); show("team1"); });

  // Name entry
  function setupNameForm(n, nextScreen) {
    const input = $("team" + n + "Input");
    const count = $("team" + n + "Count");
    const btn = $("team" + n + "Next");
    input.addEventListener("input", () => {
      count.textContent = input.value.length;
      btn.disabled = input.value.trim() === "";
    });
    function go() {
      const name = input.value.trim();
      if (!name) return;
      state.names[n - 1] = name;
      nextScreen();
    }
    btn.addEventListener("click", go);
    input.addEventListener("keydown", e => {
      if (e.key === "Enter") { e.preventDefault(); go(); }
    });
  }
  setupNameForm(1, () => show("team2"));
  setupNameForm(2, startQuiz);

  function startQuiz() {
    state.scores = [0, 0];
    state.index = 0;
    $("t1Name").textContent = state.names[0];
    $("t2Name").textContent = state.names[1];
    $("t1Score").textContent = "0";
    $("t2Score").textContent = "0";
    renderQuestion();
    show("quiz");
    beginTurn(state.first);
  }

  function renderQuestion() {
    const q = QUESTIONS[state.index];
    state.revealed = false;
    $("roundLabel").textContent = q.bonus ? "Bonus round" : q.topic;
    $("qCount").textContent = "Question " + q.num + " of " + q.of;
    $("questionText").textContent = q.text;

    state.picks = [null, null];
    state.first = state.index % 2 === 0 ? 1 : 2;
    state.active = 0;
    $("hint").textContent = "";
    [1, 2].forEach(t => teamEl(t).classList.remove("turn", "flash"));

    const wrap = $("answers");
    wrap.innerHTML = "";
    q.options.forEach((opt, i) => {
      const row = document.createElement("div");
      row.className = "answer";
      row.dataset.index = i;
      row.append(makePick(1, i, opt));
      const text = document.createElement("div");
      text.className = "text";
      const letter = document.createElement("span");
      letter.className = "letter";
      letter.textContent = LETTERS[i];
      text.append(letter, opt);
      row.append(text);
      row.append(makePick(2, i, opt));
      wrap.append(row);
    });

    $("feedback").innerHTML = "";
    const btn = $("submitBtn");
    btn.textContent = "Submit";
    btn.disabled = true;
  }

  function makePick(team, i, opt) {
    const label = document.createElement("label");
    label.className = "pick t" + team;
    const input = document.createElement("input");
    input.type = "radio";
    input.name = "team" + team;
    input.value = i;
    input.setAttribute("aria-label", state.names[team - 1] + " picks " + LETTERS[i] + ", " + opt);
    input.disabled = true;
    input.addEventListener("change", () => onPick(team, i));
    const box = document.createElement("span");
    box.className = "box";
    label.classList.add("waiting");
    label.append(input, box);
    return label;
  }

  function getPick(team) {
    return state.picks ? state.picks[team - 1] : null;
  }

  function teamEl(team) { return document.querySelector(".team.t" + team); }

  function setHint(team, text) {
    const hint = $("hint");
    hint.textContent = "";
    if (team) {
      const b = document.createElement("b");
      b.className = team === 1 ? "r" : "b";
      b.textContent = state.names[team - 1];
      hint.append(b);
    }
    hint.append(text);
  }

  // A team's turn: flash their name, sound, unlock their boxes
  function beginTurn(team) {
    state.active = team;
    document.querySelectorAll(".pick.t" + team).forEach(p => {
      p.classList.remove("waiting");
      p.querySelector("input").disabled = false;
    });
    [1, 2].forEach(t => teamEl(t).classList.toggle("turn", t === team));
    const el = teamEl(team);
    el.classList.remove("flash");
    void el.offsetWidth;
    el.classList.add("flash");
    setHint(team, ", your turn. Pick an answer.");
    playTurn();
  }

  // Lock a team's answer and hide which box they picked
  function lockTeam(team) {
    document.querySelectorAll(".pick.t" + team).forEach(p => {
      p.classList.remove("waiting");
      p.classList.add("locked");
      p.querySelector("input").disabled = true;
    });
  }

  function onPick(team, i) {
    if (team !== state.active || state.revealed) return;
    state.picks[team - 1] = i;
    lockTeam(team);
    if (state.picks[0] === null || state.picks[1] === null) {
      beginTurn(team === 1 ? 2 : 1);
    } else {
      state.active = 0;
      [1, 2].forEach(t => teamEl(t).classList.remove("turn"));
      setHint(0, "Both answers locked in. Press Submit!");
      playTurn();
      updateSubmit();
    }
  }

  function updateSubmit() {
    if (state.revealed) return;
    $("submitBtn").disabled = getPick(1) === null || getPick(2) === null;
  }

  function bumpScore(id, value) {
    const el = $(id);
    el.textContent = value;
    el.classList.remove("bump");
    void el.offsetWidth;
    el.classList.add("bump");
  }

  $("submitBtn").addEventListener("click", () => {
    if (!state.revealed) reveal();
    else nextQuestion();
  });

  function reveal() {
    const q = QUESTIONS[state.index];
    const p1 = getPick(1), p2 = getPick(2);
    if (p1 === null || p2 === null) return;
    state.revealed = true;
    $("hint").textContent = "";
    document.querySelectorAll("#answers .pick").forEach(p => p.classList.remove("locked", "waiting"));

    document.querySelectorAll("#answers input").forEach(inp => inp.disabled = true);
    document.querySelectorAll("#answers .answer").forEach(row => {
      const i = Number(row.dataset.index);
      if (i === q.answer) row.classList.add("correct");
      else if (i !== p1 && i !== p2) row.classList.add("dim");
    });

    const right1 = p1 === q.answer, right2 = p2 === q.answer;
    if (right1) { state.scores[0]++; bumpScore("t1Score", state.scores[0]); }
    if (right2) { state.scores[1]++; bumpScore("t2Score", state.scores[1]); }

    const fb = $("feedback");
    fb.innerHTML = "";
    const ans = document.createElement("div");
    ans.className = "ans";
    ans.textContent = "The answer is " + LETTERS[q.answer] + ": " + q.options[q.answer];
    const who = document.createElement("div");
    who.className = "who";
    if (right1 && right2) who.textContent = "Both teams got it right! +1 each";
    else if (right1) who.textContent = state.names[0] + " gets the point!";
    else if (right2) who.textContent = state.names[1] + " gets the point!";
    else who.textContent = "Nobody got that one.";
    fb.append(ans, who);
    playReveal();

    const btn = $("submitBtn");
    btn.disabled = false;
    btn.textContent = state.index === QUESTIONS.length - 1 ? "See the results" : "Next question";
    btn.focus();
  }

  function nextQuestion() {
    state.index++;
    if (state.index >= QUESTIONS.length) { showFinal(); return; }
    renderQuestion();
    const q = QUESTIONS[state.index];
    if (q.bonus && q.num === 1) { show("bonus"); return; }
    window.scrollTo(0, 0);
    beginTurn(state.first);
  }

  function showFinal() {
    const [n1, n2] = state.names;
    const [s1, s2] = state.scores;
    $("final1").textContent = n1 + " scored " + s1;
    $("final2").textContent = n2 + " scored " + s2;
    if (s1 === s2) {
      $("winnerMsg").textContent = "Congratulations, it's a tie!";
      $("loserMsg").textContent = "";
    } else {
      const winner = s1 > s2 ? n1 : n2;
      const loser = s1 > s2 ? n2 : n1;
      $("winnerMsg").textContent = "CONGRATULATIONS team " + winner + ", you are the sharpest tool in the box!";
      $("loserMsg").textContent = "Better luck next time team " + loser;
    }
    show("final");
    confetti();
    playFanfare();
  }

  function confetti() {
    const box = document.createElement("div");
    box.className = "confetti";
    const colours = ["#E63946", "#1E6FD9", "#FFC93C", "#22A86A", "#7B4FD6"];
    for (let i = 0; i < 80; i++) {
      const piece = document.createElement("i");
      piece.style.left = Math.random() * 100 + "vw";
      piece.style.background = colours[i % colours.length];
      piece.style.animationDuration = (2.5 + Math.random() * 2.5) + "s";
      piece.style.animationDelay = (Math.random() * 1.5) + "s";
      box.append(piece);
    }
    document.body.append(box);
    setTimeout(() => box.remove(), 7000);
  }

  $("bonusBtn").addEventListener("click", () => { show("quiz"); beginTurn(state.first); });

  $("againBtn").addEventListener("click", () => {
    $("team1Input").value = state.names[0];
    $("team2Input").value = state.names[1];
    $("team1Count").textContent = state.names[0].length;
    $("team2Count").textContent = state.names[1].length;
    $("team1Next").disabled = false;
    $("team2Next").disabled = false;
    show("home");
  });
</script>
</body>
</html>
